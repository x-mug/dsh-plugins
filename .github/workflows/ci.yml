name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.28.5'
      - name: Install session-header dependencies
        run: pnpm --dir plugins/dsh-session-header install --frozen-lockfile --ignore-scripts
      - name: Verify plugins
        run: node scripts/verify.mjs
      - name: Pack and verify packages
        shell: bash
        run: |
          mkdir -p dist
          for plugin in dsh-auto-review-cache-identity dsh-code-location-links dsh-session-find dsh-session-header; do
            (cd "plugins/$plugin" && npm pack --ignore-scripts --pack-destination ../../dist)
          done
          node scripts/check-packages.mjs
